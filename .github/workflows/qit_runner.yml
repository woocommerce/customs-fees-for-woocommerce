name: Run QIT

on:
    workflow_call:
        inputs:
            extension:
                required: true
                type: string
            artifact:
                type: string
                required: true
            wp-version:
                type: string
                default: 'stable'
            wc-version:
                type: string
                default: 'stable'
            php-version:
                type: string
                default: '8.4'
            # Customize which QIT test types to run.
            test-activation:
                type: string
                default: 'false'
            test-security:
                type: string
                default: 'false'
            test-phpcompatibility:
                type: string
                default: 'false'
            test-phpstan:
                type: string
                default: 'false'
            test-woo-api:
                type: string
                default: 'false'
            test-woo-e2e:
                type: string
                default: 'false'
            test-e2e:
                type: string
                default: 'false'
            test-additional-plugins:
                type: string
                default: ''
            test-malware:
                type: string
                default: 'false'
            test-plugin-check:
                type: string
                default: 'false'
            test-validation:
                type: string
                default: 'false'
            options:
                type: string
                default: ''
            # End of QIT tests.
            wait:
                type: boolean
                default: true

env:
    NO_COLOR: 1
    QIT_DISABLE_ONBOARDING: yes
    EXTENSION_SLUG: ${{ inputs.extension }}
    WP_VERSION: ${{ inputs.wp-version && inputs.wp-version || 'stable' }}
    WC_VERSION: ${{ inputs.wc-version && inputs.wc-version || 'stable' }}
    PHP_VERSION: ${{ inputs.php-version && inputs.php-version || '8.4' }}
    ADDITIONAL_PLUGINS: ${{ inputs.test-additional-plugins && format( '--additional_plugins={0}', inputs.test-additional-plugins ) || '' }}
    WAIT_FLAG: ${{ inputs.wait && '--wait' || '' }}
    EXTRA_OPTIONS: ${{ inputs.options }}

jobs:
    qit-tests:
        name: Run QIT Tests
        runs-on: ubuntu-latest
        timeout-minutes: 45
        steps:
            - name: Install QIT via composer
              shell: bash
              run: composer require woocommerce/qit-cli

            - name: Add Partner and Prepare Environment
              shell: bash
              run: |

                  # Add Partner.
                  ./vendor/bin/qit partner:add \
                    --user='${{ secrets.PARTNER_USER }}' \
                    --qit_token='${{ secrets.PARTNER_SECRET }}'

                  # Export ZIP file path to GITHUB_ENV.
                  echo "ZIP_FILE_PATH=${{ github.workspace }}/$EXTENSION_SLUG.zip" >> $GITHUB_ENV

                  # Create a directory to store QIT Results.
                  mkdir ${{ github.workspace }}/qit-results

            - name: Download the zip
              uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
              with:
                  name: ${{ inputs.artifact }}
                  path: ${{ github.workspace }}

            ##############################
            # Activation Tests.
            ##############################

            - name: Activation test
              id: run-activation-test
              if: ${{ inputs.test-activation == 'true' }}
              # Do not fail when the `qit` fails, so we can annotate the results.
              shell: bash --noprofile --norc {0}
              run: |
                  echo "Running activation test for ${{ env.EXTENSION_SLUG }}"
                  ./vendor/bin/qit run:activation \
                    ${{ env.EXTENSION_SLUG }} \
                    --zip=${{ env.ZIP_FILE_PATH }} \
                    --wp=${{ env.WP_VERSION }} \
                    --woo=${{ env.WC_VERSION }} \
                    --php_version=${{ env.PHP_VERSION }} \
                    ${{ env.EXTRA_OPTIONS }} \
                    -n \
                    > ${{ github.workspace }}/qit-results/qit-activation-results.txt
                  echo "exitcode=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

            - name: Echo activation results
              if: ${{ inputs.test-activation == 'true' }}
              run: |
                  cat ${{ github.workspace }}/qit-results/qit-activation-results.txt
                  exit ${{ steps.run-activation-test.outputs.exitcode == 1 && 1 || 0 }}

            ##############################
            # Security Tests.
            ##############################

            - name: Run security test
              id: run-security-test
              if: ${{ inputs.test-security == 'true' }}
              # Do not fail when the `qit` fails, so we can annotate the results.
              shell: bash --noprofile --norc {0}
              run: |
                  ./vendor/bin/qit run:security \
                    ${{ env.EXTENSION_SLUG }} \
                    --zip=${{ env.ZIP_FILE_PATH }} \
                    ${{ env.WAIT_FLAG }} \
                    ${{ env.EXTRA_OPTIONS }} \
                    -n \
                    > ${{ github.workspace }}/qit-results/qit-security-results.txt
                  echo "exitcode=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

            - name: Echo security results
              if: ${{ inputs.test-security == 'true' }}
              run: |
                  cat ${{ github.workspace }}/qit-results/qit-security-results.txt
                  exit ${{ steps.run-security-test.outputs.exitcode == 1 && 1 || 0 }}

            ##############################
            # PHP Compatibility Tests.
            ##############################

            - name: Run PHP compatibility test
              id: run-php-compatibility-test
              if: ${{ inputs.test-phpcompatibility == 'true' }}
              # Do not fail when the `qit` fails, so we can annotate the results.
              shell: bash --noprofile --norc {0}
              run: |
                  ./vendor/bin/qit run:phpcompatibility \
                    ${{ env.EXTENSION_SLUG }} \
                    --zip=${{ env.ZIP_FILE_PATH }} \
                    ${{ env.WAIT_FLAG }} \
                    ${{ env.EXTRA_OPTIONS }} \
                    -n \
                    > ${{ github.workspace }}/qit-results/qit-php-compatibility-results.txt
                  echo "exitcode=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

            - name: Echo PHP compatibility results
              if: ${{ inputs.test-phpcompatibility == 'true' }}
              run: |
                  cat ${{ github.workspace }}/qit-results/qit-php-compatibility-results.txt
                  exit ${{ steps.run-php-compatibility-test.outputs.exitcode == 1 && 1 || 0 }}

            ##############################
            # PHPStan Tests.
            ##############################
            - name: Run PHPStan Tests
              id: run-phpstan-tests
              if: ${{ inputs.test-phpstan == 'true' }}
              # Do not fail when the `qit` fails, so we can annotate the results.
              shell: bash --noprofile --norc {0}
              run: |
                  ./vendor/bin/qit run:phpstan \
                    ${{ env.EXTENSION_SLUG }} \
                    --zip=${{ env.ZIP_FILE_PATH }} \
                    --wordpress_version=${{ env.WP_VERSION == 'nightly' && 'rc' || env.WP_VERSION }}  \
                    --woocommerce_version=${{ env.WC_VERSION == 'nightly' && 'rc' || env.WC_VERSION }}  \
                    ${{ env.ADDITIONAL_PLUGINS }} \
                    ${{ env.WAIT_FLAG }} \
                    ${{ env.EXTRA_OPTIONS }} \
                    -n \
                    > ${{ github.workspace }}/qit-results/qit-phpstan-results.txt
                  echo "exitcode=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

            - name: Echo PHPStan results
              if: ${{ inputs.test-phpstan == 'true' }}
              run: |

                  cat ${{ github.workspace }}/qit-results/qit-phpstan-results.txt
                  exit ${{ steps.run-phpstan-tests.outputs.exitcode == 1 && 1 || 0 }}

            ##############################
            # WC API Tests.
            ##############################
            - name: Run WC API Tests
              id: run-woo-api-tests
              if: ${{ inputs.test-woo-api == 'true' }}
              # Do not fail when the `qit` fails, so we can annotate the results.
              shell: bash --noprofile --norc {0}
              run: |
                  ./vendor/bin/qit run:woo-api \
                    ${{ env.EXTENSION_SLUG }} \
                    --zip=${{ env.ZIP_FILE_PATH }} \
                    --wordpress_version=${{ env.WP_VERSION == 'nightly' && 'rc' || env.WP_VERSION }} \
                    --woocommerce_version=${{ env.WC_VERSION == 'nightly' && 'rc' || env.WC_VERSION }} \
                    --php_version=${{ env.PHP_VERSION }} \
                    ${{ env.ADDITIONAL_PLUGINS }} \
                    ${{ env.WAIT_FLAG }} \
                    ${{ env.EXTRA_OPTIONS }} \
                    -n \
                    > ${{ github.workspace }}/qit-results/qit-woo-api-results.txt
                  echo "exitcode=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

            - name: Echo WC API results
              if: ${{ inputs.test-woo-api == 'true' }}
              run: |
                  cat ${{ github.workspace }}/qit-results/qit-woo-api-results.txt
                  exit ${{ steps.run-woo-api-tests.outputs.exitcode == 1 && 1 || 0 }}

            ##############################
            # Malware Tests.
            ##############################
            - name: Run Malware Tests
              id: run-malware-tests
              if: ${{ inputs.test-malware == 'true' }}
              # Do not fail when the `qit` fails, so we can annotate the results.
              shell: bash --noprofile --norc {0}
              run: |
                  ./vendor/bin/qit run:malware \
                    ${{ env.EXTENSION_SLUG }} \
                    --zip=${{ env.ZIP_FILE_PATH }} \
                    ${{ env.WAIT_FLAG }} \
                    ${{ env.EXTRA_OPTIONS }} \
                    -n \
                    > ${{ github.workspace }}/qit-results/qit-malware-results.txt
                  echo "exitcode=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

            - name: Echo Malware results
              if: ${{ inputs.test-malware == 'true' }}
              run: |
                  cat ${{ github.workspace }}/qit-results/qit-malware-results.txt
                  exit ${{ steps.run-malware-tests.outputs.exitcode == 1 && 1 || 0 }}

            ##############################
            # Validation Tests.
            ##############################
            - name: Run Validation Tests
              id: run-validation-tests
              if: ${{ inputs.test-validation == 'true' }}
              # Do not fail when the `qit` fails, so we can annotate the results.
              shell: bash --noprofile --norc {0}
              run: |
                  ./vendor/bin/qit run:validation \
                    ${{ env.EXTENSION_SLUG }} \
                    --zip=${{ env.ZIP_FILE_PATH }} \
                    --php_version=${{ env.PHP_VERSION }} \
                    ${{ env.WAIT_FLAG }} \
                    ${{ env.EXTRA_OPTIONS }} \
                    -n \
                    > ${{ github.workspace }}/qit-results/qit-validation-results.txt
                  echo "exitcode=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

            - name: Upload results
              if: always()
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
              with:
                  name: qit-results
                  path: ${{ github.workspace }}/qit-results/

            ##############################
            # Plugin Check Tests (for dotOrg).
            ##############################
            - name: Run Plugin Check Tests
              id: run-plugin-check-tests
              if: ${{ inputs.test-plugin-check == 'true' }}
              # Do not fail when the `qit` fails, so we can annotate the results.
              shell: bash --noprofile --norc {0}
              run: |
                  ./vendor/bin/qit run:plugin-check \
                    ${{ env.EXTENSION_SLUG }} \
                    --zip=${{ env.ZIP_FILE_PATH }} \
                    ${{ env.WAIT_FLAG }} \
                    ${{ env.EXTRA_OPTIONS }} \
                    -n \
                    > ${{ github.workspace }}/qit-results/qit-plugin-check-results.txt
                  echo "exitcode=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

            - name: Echo Plugin Check results
              if: ${{ inputs.test-plugin-check == 'true' }}
              run: |
                  cat ${{ github.workspace }}/qit-results/qit-plugin-check-results.txt
                  exit ${{ steps.run-plugin-check-tests.outputs.exitcode == 1 && 1 || 0 }}
                                    
            ##############################
            # WC E2E Tests.
            ##############################
            - name: Run WC E2E Tests
              id: run-woo-e2e-tests
              if: ${{ inputs.test-woo-e2e == 'true' }}
              # Do not fail when the `qit` fails, so we can annotate the results.
              shell: bash --noprofile --norc {0}
              run: |
                  ./vendor/bin/qit run:woo-e2e \
                    ${{ env.EXTENSION_SLUG }} \
                    --zip=${{ env.ZIP_FILE_PATH }} \
                    --wordpress_version=${{ env.WP_VERSION == 'nightly' && 'rc' || env.WP_VERSION }} \
                    --woocommerce_version=${{ env.WC_VERSION == 'nightly' && 'rc' || env.WC_VERSION }} \
                    --php_version=${{ env.PHP_VERSION }} \
                    ${{ env.ADDITIONAL_PLUGINS }} \
                    ${{ env.WAIT_FLAG }} \
                    ${{ env.EXTRA_OPTIONS }} \
                    -n \
                    > ${{ github.workspace }}/qit-results/qit-woo-e2e-results.txt
                  echo "exitcode=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

            - name: Echo WC E2E results
              if: ${{ inputs.test-woo-e2e == 'true' }}
              run: |
                  cat ${{ github.workspace }}/qit-results/qit-woo-e2e-results.txt
                  exit ${{ steps.run-woo-e2e-tests.outputs.exitcode == 1 && 1 || 0 }}                  

            ##############################
            # Custom Plugin E2E Tests (tests/e2e, QIT run:e2e).
            ##############################

            - name: Checkout repository (custom e2e tests only)
              # These steps carry !cancelled() instead of a bare condition
              # (which implies success()): they run last in the job, after
              # "Echo WC E2E results" which exits 1 on a red WC E2E suite, and
              # weekly cron is the only automated trigger, so a bare condition
              # would let any upstream failure silently skip this suite.
              if: ${{ !cancelled() && inputs.test-e2e == 'true' }}
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
              with:
                  # Cone mode only takes directory prefixes; it is disabled so the
                  # qit.json file pattern is honoured. The checkout is read-only
                  # and feeds npm installs, so the token is not persisted.
                  sparse-checkout: |
                      tests/e2e
                      qit.json
                  sparse-checkout-cone-mode: false
                  persist-credentials: false
                  path: custom-tests

            - name: Typecheck custom E2E suite
              # Playwright strips TypeScript types without checking them, so
              # tsconfig.json is only enforced here.
              if: ${{ !cancelled() && inputs.test-e2e == 'true' }}
              working-directory: custom-tests/tests/e2e
              run: npm ci && npm run typecheck

            - name: Run Custom E2E Tests
              id: run-e2e-tests
              if: ${{ !cancelled() && inputs.test-e2e == 'true' }}
              # Do not fail when the `qit` fails, so we can annotate the results.
              shell: bash --noprofile --norc {0}
              run: |
                  # The suite must be registered with --test-package (a positional
                  # path is ignored and yields a green-looking "0/0 packages
                  # executed"). The build artifact is already <slug>/-wrapped by
                  # pnpm postarchive, so it is handed straight to --zip. --config
                  # points at the sparse-checked-out qit.json so run:e2e installs
                  # WooCommerce (--woo is only a version pin; it does not install
                  # WooCommerce). nightly is not a valid --wp/--woo value; map it
                  # to rc like the woo-e2e step.
                  wp_version="${WP_VERSION}"
                  woo_version="${WC_VERSION}"
                  [ "${wp_version}" = "nightly" ] && wp_version="rc"
                  [ "${woo_version}" = "nightly" ] && woo_version="rc"

                  # qit resolves relative plugin paths in the env config against
                  # the current working directory, not the config file location,
                  # so run from the sparse checkout (where qit.json and tests/e2e
                  # live); the binary, zip, and results stay addressed absolutely.
                  cd "${GITHUB_WORKSPACE}/custom-tests"

                  "${GITHUB_WORKSPACE}/vendor/bin/qit" run:e2e \
                    "${EXTENSION_SLUG}" \
                    --zip="${ZIP_FILE_PATH}" \
                    --config="${GITHUB_WORKSPACE}/custom-tests/qit.json" \
                    --test-package="${GITHUB_WORKSPACE}/custom-tests/tests/e2e" \
                    --wp="${wp_version}" \
                    --woo="${woo_version}" \
                    --php_version="${PHP_VERSION}" \
                    --print-report-url \
                    ${ADDITIONAL_PLUGINS} \
                    ${EXTRA_OPTIONS} \
                    -n \
                    > "${GITHUB_WORKSPACE}/qit-results/qit-e2e-results.txt"
                  echo "exitcode=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

            - name: Echo Custom E2E results
              if: ${{ !cancelled() && inputs.test-e2e == 'true' }}
              shell: bash --noprofile --norc {0}
              run: |
                  results_file="${{ github.workspace }}/qit-results/qit-e2e-results.txt"
                  cat "${results_file}"

                  # Surface per-test failures from the merged CTRF report: the
                  # QIT summary only carries pass/fail counts, and the full HTML
                  # report lives on the QIT dashboard.
                  ctrf_file=$(find "${RUNNER_TEMP}" /tmp -path '*qit-e2e-artifacts-*/final/ctrf/ctrf-report.json' 2>/dev/null | head -1)
                  if [ -n "${ctrf_file}" ]; then
                      cp "${ctrf_file}" "${{ github.workspace }}/qit-results/qit-e2e-ctrf.json"
                      jq -r '.results.tests[] | select(.status != "passed") | "--- FAILED: \(.name)\n\(.message // "(no message)")\n\(.trace // "")"' "${ctrf_file}" || true
                  fi

                  # Fail unless at least one test package actually executed. An
                  # infrastructure failure inside the package loop prints
                  # "Packages:      0/1 executed" with exit code 3, which is
                  # otherwise treated as a non-fatal warning below. Format source:
                  # PackageOrchestrator::summary() in qit-cli.
                  if ! grep -qE 'Packages:[[:space:]]*[1-9][0-9]*/[0-9]+ executed' "${results_file}"; then
                      echo "::error::Custom E2E run executed no test packages."
                      exit 1
                  fi

                  # An executed package can still assert nothing: Playwright exits 0
                  # when every test is skipped. Requiring passing tests and no
                  # failures also closes the gap where a real failure is masked by
                  # the exit-3 warning below.
                  if ! grep -qE 'Tests:[[:space:]]*[1-9][0-9]* passed, 0 failed' "${results_file}"; then
                      echo "::error::Custom E2E run reported no passing tests, or reported failures."
                      exit 1
                  fi

                  # Exit 1 == test failures. Exit 3 is a non-fatal QIT WARNING
                  # (benign debug.log notices, common on rc/nightly) and, like
                  # every sibling step, must not fail the job. Any other non-zero
                  # (bad args, timeout) is a real failure - fail closed.
                  exitcode="${{ steps.run-e2e-tests.outputs.exitcode }}"
                  case "${exitcode}" in
                      0 | 3 ) exit 0 ;;
                      * ) exit 1 ;;
                  esac

            - name: Upload Custom E2E results
              if: ${{ always() && inputs.test-e2e == 'true' }}
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
              with:
                  # The shared "Upload results" step runs before this step writes
                  # its results file, so the E2E output gets its own artifact.
                  name: qit-e2e-results
                  path: |
                      ${{ github.workspace }}/qit-results/qit-e2e-results.txt
                      ${{ github.workspace }}/qit-results/qit-e2e-ctrf.json
                  if-no-files-found: warn
